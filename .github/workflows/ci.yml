name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # root workspace: ランタイムコア、ジェネレータ、host ポート
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # wasm-tools は check-sigs.sh と spec テストランナーが使う
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      # spec testsuite（固定 SHA）。runtime/tests/spec.rs が使う
      - run: sh tools/fetch-testsuite.sh
      # 生成物の diff ゼロ検査（Phase 1 完了条件）と spec テストを含む
      - run: cargo test
      - run: cargo run -p wasmicon-gen -- --check
      # 参照実装 tools/wit2sig.py との突き合わせ（HANDOFF §5 Phase 1）
      - run: sh tools/check-sigs.sh

  # guest workspace: wasm32-unknown-unknown 向けバインディング
  guest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
