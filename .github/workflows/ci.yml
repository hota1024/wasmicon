# CI: seven jobs, one per Cargo workspace that can be built on a stock Linux runner.
#
#   root          runtime core, generator, host port (fmt, clippy, tests, generated-file
#                 and signature checks, trace-diff self-test)
#   guest         bindings and apps for wasm32-unknown-unknown
#   rp2040        ports/rp2040 builds for thumbv6m (build-only; no hardware in CI)
#   rp2350        ports/rp2350 builds for thumbv8m (build-only)
#   esp32c5       ports/esp32c5 builds for riscv32imac (build-only)
#   esp32p4       ports/esp32p4 builds for riscv32imafc (build-only)
#   differential  wasmicon-core vs. wasmtime on the same .wasm
#
# ESP32-S3 has no job: it needs the Xtensa toolchain that espup installs, which is not
# available on the runner. Check it locally with
#   sh ports/esp32s3/build.sh clippy --release -- -D warnings
#   sh ports/esp32s3/build.sh clippy --release --features hw-probe -- -D warnings
# (the second keeps src/probe.rs, used only for hardware triage, from rotting).
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The runner is pinned to ubuntu-24.04 (2026-10-08). ubuntu-latest moves to Ubuntu 26 on
# 2026-10-19; like rust-toolchain.toml, the runner must not change under us.
# The actions are the v5 releases, which run on Node.js 24 (v4 targets Node.js 20, deprecated).

jobs:
  # root workspace: runtime core, generator, host port.
  # The host-port tests build and run the guests under apps/, so the Rust wasm32 target,
  # AssemblyScript and clang are needed here too.
  root:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # Needed because the ports/host tests build the guests under apps/.
      # rust-toolchain.toml does not always reach a nested cargo, so add the target explicitly.
      - run: rustup target add wasm32-unknown-unknown
      # Needed because the ports/host tests build apps/blink-c through bindings/c/build.sh,
      # which uses clang's wasm32 target and wasm-ld (lld).
      - run: sudo apt-get update && sudo apt-get install -y clang lld
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # wasm-tools is used by check-sigs.sh, the spec tests and the guest feature check.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      # The spec testsuite (pinned SHA); runtime/tests/spec.rs uses it.
      - run: sh tools/fetch-testsuite.sh
      # Includes the generated-file diff check, the spec tests, and the trace-equality
      # tests of the Rust and AS versions of blink and sensor-display.
      - run: cargo test
      - run: cargo run -p wasmicon-gen -- --check
      # Cross-checks the generated signatures against the reference tools/wit2sig.py.
      - run: sh tools/check-sigs.sh
      # English only, and every section citation names its document and resolves.
      - run: sh tools/check-english.sh
      - run: sh tools/check-citations.sh
      # The runtime core has no dependency crates (docs/decisions.md D-11).
      - run: test "$(cargo tree -p wasmicon-core --edges normal --depth 1 | wc -l)" -eq 1
      # Rustdoc builds without warnings (broken intra-doc links are warnings).
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --workspace
      # Self-test of the trace-diff script's normalization.
      - run: sh verify/diff-traces.sh --self-test

  # guest workspace: bindings and apps for wasm32-unknown-unknown.
  guest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v5
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

  # RP2040 port. Only checks that the thumbv6m build passes (no hardware in CI).
  rp2040:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ports/rp2040
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add thumbv6m-none-eabi
      # The firmware contains no app (docs/app-workflow.md §3.3), so apps/ need not be
      # built first.
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  # RP2350 port. Only checks that the thumbv8m build passes (no hardware in CI).
  rp2350:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ports/rp2350
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add thumbv8m.main-none-eabihf
      # The firmware contains no app (docs/app-workflow.md §3.3), so apps/ need not be
      # built first.
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  # ESP32-C5 port. RISC-V, so upstream Rust builds it (no espup needed).
  # Only checks that the riscv32imac build passes (no hardware in CI).
  esp32c5:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ports/esp32c5
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add riscv32imac-unknown-none-elf
      # The firmware contains no app (docs/app-workflow.md §3.3), so apps/ need not be
      # built first.
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  # ESP32-P4 port. RISC-V like the C5; the build also links in pre-v3.x and
  # the local esp-sync copy, so a change upstream that breaks them shows here.
  # Only checks that the riscv32imafc build passes (no hardware in CI).
  esp32p4:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ports/esp32p4
    steps:
      - uses: actions/checkout@v5
      - run: rustup target add riscv32imafc-unknown-none-elf
      # The firmware contains no app (docs/app-workflow.md §3.3), so apps/ need not be
      # built first.
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release
      # The `esp32p4-psram` firmware: the arena in PSRAM, and the Tab5 panel's
      # frame buffer after it.
      - run: cargo clippy --release --features psram -- -D warnings
      - run: cargo build --release --features psram

  # ESP32-S3 is not built in CI: it needs the Xtensa toolchain from espup.
  # Check it locally with the two commands in the file header (the same combination as the
  # rp2350 job, plus the hw-probe triage feature).

  # Differential test against wasmtime: the same .wasm must produce the same trace in
  # wasmicon-core and in wasmtime (docs/verification-report.md §2).
  # wasmtime has a large dependency tree, so it lives in its own workspace and job.
  differential:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: verify/differential
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: verify/differential
      - run: cargo test
        working-directory: verify/differential
