name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # root workspace: ランタイムコア、ジェネレータ、host ポート
  # host ポートのテストは apps/ のゲストをビルドして動かすので、
  # Rust の wasm32 ターゲットと AssemblyScript もここで要る。
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # ports/host のテストが apps/ のゲストをビルドするので必要。
      # 入れ子の cargo には rust-toolchain.toml が効かない場合があるため明示する。
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # wasm-tools は check-sigs.sh、spec テスト、ゲストの機能検査が使う
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      # spec testsuite（固定 SHA）。runtime/tests/spec.rs が使う
      - run: sh tools/fetch-testsuite.sh
      # 生成物の diff ゼロ検査（Phase 1）、spec テスト（Phase 2）、
      # blink と sensor-display の Rust 版 / AS 版のトレース一致（Phase 3 / 5）を含む
      - run: cargo test
      - run: cargo run -p wasmicon-gen -- --check
      # 参照実装 tools/wit2sig.py との突き合わせ（docs/handoff.md §5 Phase 1）
      - run: sh tools/check-sigs.sh
      # トレース diff スクリプトの正規化（docs/handoff.md §5 Phase 6 の (2)）
      - run: sh verify/diff-traces.sh --self-test

  # guest workspace: wasm32-unknown-unknown 向けのバインディングとアプリ
  guest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

  # RP2040 ポート。thumbv6m のビルドが通ることだけを見る（実機は回せない）。
  rp2040:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ports/rp2040
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv6m-none-eabi
      # ゲストを先に作る（include_bytes! で埋め込むため）
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo build --release
        working-directory: apps
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: cargo build --release

  # ESP32-S3 は espup の Xtensa ツールチェーンが要るので CI では回さない。
  # ローカルで `ports/esp32s3/build.sh build --release` を使う。

  # wasmtime との差分テスト（docs/handoff.md §5 Phase 6 の (3)）。
  # wasmtime は依存が大きいので別 workspace・別ジョブにしてある。
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo fmt --check
        working-directory: verify/differential
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: verify/differential
      - run: cargo test
        working-directory: verify/differential
