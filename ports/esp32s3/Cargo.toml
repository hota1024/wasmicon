# ESP32-S3 (DevKitC-1) 用ポート。
# Xtensa は upstream Rust 非対応なので espup が入れる esp toolchain を使う。
# root workspace とは toolchain もターゲットも違うので別 workspace。
[workspace]

[package]
name = "wasmicon-esp32s3"
description = "Wasmicon の ESP32-S3 ポート"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
# docs/handoff.md §5 Phase 4: トレースを出すビルド。既定で有効にしておく。
default = ["trace"]
trace = []
# 埋め込むゲストを blink から ILI9341 のデモに差し替える
# （apps/lcd-demo-rs/README.md）。
guest-lcd-demo = []
# 実機の切り分け用。ゲストの前にポート層を直接叩いて ILI9341 の ID を読む
# （src/probe.rs）。切り分け専用なので既定では入れない。
hw-probe = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
# ESP-IDF の 2 段目ブートローダが要求する app descriptor（`esp_app_desc!`）のため。
# これが無いと espflash 4.5 が「App Descriptor missing」で書き込みを拒否する。
# パーティションテーブルの検査は使わないので default-features は切る。
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = [
    "esp32s3",
] }
# アプリスロットをフラッシュから読む（docs/app-workflow.md §3.3）。
# ESP32-S3 は任意オフセットが XIP にマップされている前提を置けないので、
# Pico 系と違って RAM に写す。写すのは**ヘッダが持つ長さの分だけ**
# （スロットは 64 KiB だがアプリは数 KB。DRAM はほぼ使い切っている）。
esp-storage = { version = "0.10", features = ["esp32s3"] }
# 出力は自前の UART で行うので esp-println / esp-backtrace は入れない。
# panic handler は自前で持つ（docs/handoff.md §3 #4: ログを出して停止、再起動しない）。

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
