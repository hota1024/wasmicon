# Port for the ESP32-S3 (Freenove ESP32-S3-WROOM).
# Xtensa is not supported by upstream Rust, so this uses the esp toolchain
# from espup (docs/decisions.md P-10). Its own workspace: toolchain and target
# differ from the root workspace.
[workspace]

[package]
name = "wasmicon-esp32s3"
description = "Wasmicon port for the ESP32-S3"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[features]
# Build that writes the trace. On by default.
default = ["trace"]
trace = []
# Hardware diagnosis: drives the port layer directly before the guest runs and
# reads the ILI9341 ID (src/probe.rs). Diagnosis only, so off by default.
hw-probe = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
esp-hal = { version = "1.1", features = ["esp32s3", "unstable"] }
# For the app descriptor (`esp_app_desc!`) that the ESP-IDF second-stage
# bootloader requires; without it espflash 4.5 refuses to flash
# ("App Descriptor missing"). The partition-table check is unused, so default
# features are off.
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = [
    "esp32s3",
] }
# Reads the app slot from flash (docs/app-workflow.md §3.3). The ESP32-S3
# cannot assume an arbitrary offset is mapped into XIP, so unlike the Pico
# ports the app is copied to RAM, and only the length in the header (the slot
# is 64 KiB, an app a few KB, and DRAM is nearly full).
esp-storage = { version = "0.10", features = ["esp32s3"] }
# Output goes through our own UART, so esp-println / esp-backtrace are not used.
# The panic handler is our own (docs/decisions.md A-04: log and halt, no restart).

[profile.release]
# Speed over size (docs/TODO.md §4). On the RP2350, compared with opt-level z,
# computation ran 16-35% faster and host calls 7-37% faster for 71 -> 116 KB
# of code; flash has plenty of room. Raising only the interpreter and the port
# HAL to 3 did not speed up calls or host calls, probably because fat LTO runs
# its final optimization at z.
opt-level = 3
lto = "fat"
codegen-units = 1
