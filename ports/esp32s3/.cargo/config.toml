# cargo reads .cargo/config.toml relative to the current directory, so the
# target lives here and the port is built from ports/esp32s3 (through build.sh).
[build]
target = "xtensa-esp32s3-none-elf"

[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
rustflags = ["-Clink-arg=-Tlinkall.x"]

[unstable]
# No prebuilt core is shipped for Xtensa, so it is built from source.
build-std = ["core"]
