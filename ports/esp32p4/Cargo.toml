# ESP32-P4 (M5Stack Tab5) 用ポート。
# P4 は RISC-V なので upstream Rust の riscv32imafc-unknown-none-elf で
# そのまま組める（ESP32-S3 の Xtensa と違って espup は要らない）。
# root workspace とはターゲットも profile も違うので別 workspace。
[workspace]

[package]
name = "wasmicon-esp32p4"
description = "Wasmicon の ESP32-P4 ポート"
version = "0.1.0"
edition = "2021"
# esp-hal 1.2 と esp-bootloader-esp-idf 0.6 がどちらも 1.95 を要求する。
# 他のポート（1.85）より高いのはそのため。
rust-version = "1.95"

[features]
# docs/handoff.md §5 Phase 4: トレースを出すビルド。既定で有効にしておく。
# ボードは `src/boards/` からちょうど 1 つ選ぶ。既定を tab5 にしてあるので
# `cargo build --release` はそのまま Tab5 向けになる。
default = ["trace", "tab5"]
trace = []

# --- ボード（ちょうど 1 つ。src/boards/mod.rs が個数を検査する）---
tab5 = []

# 埋め込むゲストの選択。2 軸が直交する（言語 × アプリ）。既定は blink-rs。
#
#     cargo build --release                                     # blink-rs
#     cargo build --release --features guest-as                 # blink-as
#     cargo build --release --features guest-sensor             # sensor-display-rs
#     cargo build --release --features guest-as,guest-sensor    # sensor-display-as
#
# Rust 版は `cd apps && cargo build --release`、
# AS 版は `cd apps/<app>-as && npm run build` を先に実行しておくこと。
guest-as = []
guest-sensor = []

# `led` 役割を Tab5 の LCD バックライト (G22) に向けるビルド。既定では無効。
# トレースは変わらない（`role:led` に正規化されるため）。
#
# **現状これでは光らない。** バックライトの電源は内部 I2C のエキスパンダ
# (PI4IOE5V6408 pin 4 = BSP_LCD_EN) で入れる必要があり、I2C が未実装のうちは
# G22 を振っても何も起きない（2026-09-11 に実機で確認。docs/TODO.md §1.1.5）。
led-backlight = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
# esp32p4 の feature は esp-hal 1.2 から。1.1 では存在しない。
esp-hal = { version = "1.2", features = ["esp32p4", "unstable"] }
# espflash は ESP-IDF のアプリ記述子が無いイメージを焼かない。
# `esp_app_desc!()` を置くためだけに要る（ブートローダ自体は espflash が用意する）。
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32p4"] }
# 出力は自前の UART で行うので esp-println / esp-backtrace は入れない。
# panic handler は自前で持つ（docs/handoff.md §3 #4: ログを出して停止、再起動しない）。

# esp-hal が引く esp-sync を、ローカルで 1 箇所だけ直した写しに差し替える。
#
# **これは上流のバグ回避であって、好みの改変ではない。** esp-sync 0.3.0 は
# P4 v3.2/ECO7 の Zcmp ハードウェアバグ回避として mintthresh (CSR 0x347) を
# 書くが、分岐条件が `cfg(esp32p4)` だけでリビジョンを見ていない。Tab5 の
# P4 **v1.0** ではこれが不正命令になり、`esp_hal::init` の中で例外 → RWDT
# リセットの無限ループになる（2026-09-21、実機の mepc/mtval から特定）。
# 我々のターゲット `riscv32imafc` は Zcmp を含まないので元々不要な処理。
#
# **上流が直したら消すこと。** 差分は vendor/esp-sync/src/raw.rs の
# `WASMICON LOCAL PATCH` 2 箇所だけ。経緯と削除条件は docs/TODO.md §1.1.5。
[patch.crates-io]
esp-sync = { path = "vendor/esp-sync" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
