# cargo reads .cargo/config.toml relative to the current directory, so the
# target lives here and the port is built from ports/rp2350.
[build]
# Cortex-M33 of the RP2350 with the hard-float ABI (f32 runs on the FPU).
target = "thumbv8m.main-none-eabihf"

[target.thumbv8m.main-none-eabihf]
rustflags = [
    "-Clink-arg=--nmagic",
    "-Clink-arg=-Tlink.x",
    "-Ctarget-cpu=cortex-m33",
]
