# Port for the RP2350 (Raspberry Pi Pico 2 / Pico 2 W).
# Its own workspace: target, toolchain and profile differ from the root workspace.
#
# Only the Arm (Cortex-M33) side is targeted. The RP2350 also runs RISC-V
# (Hazard3), but a second instruction set on the same chip is outside the v0.1
# verification scope.
[workspace]

[package]
name = "wasmicon-rp2350"
description = "Wasmicon port for the RP2350"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
# Build that writes the trace. On by default.
default = ["trace"]
trace = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
# dcp-fast-f64 is not enabled. It swaps __aeabi_dadd / __aeabi_dmul for DCP
# versions, and nobody has checked that f64 results then still match across
# boards; it stays off until the cross-board float match of docs/TODO.md §1.3
# is verified.
rp235x-hal = { version = "0.4", features = ["rt", "critical-section-impl"] }
panic-halt = "1"

[profile.release]
# Speed over size (docs/TODO.md §4). On the RP2350, compared with opt-level z,
# computation ran 16-35% faster and host calls 7-37% faster for 71 -> 116 KB
# of code; flash has plenty of room. Raising only the interpreter and the port
# HAL to 3 did not speed up calls or host calls, probably because fat LTO runs
# its final optimization at z.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Keep debug info for probe-rs. It is not flashed.
debug = true
