# Port for the ESP32-C5 (Waveshare ESP32-C5-WIFI6-KIT, ESP32-C5-WROOM-1).
# The C5 is RISC-V, so upstream Rust's riscv32imac-unknown-none-elf builds it.
# Its own workspace: target and profile differ from the root workspace.
[workspace]

[package]
name = "wasmicon-esp32c5"
description = "Wasmicon port for the ESP32-C5"
version = "0.1.0"
edition = "2021"
# esp-hal 1.2 and esp-bootloader-esp-idf 0.6 both require 1.95.
rust-version = "1.95"

[features]
# Build that writes the trace. On by default.
default = ["trace"]
trace = []
# Hardware diagnosis: drives the port layer directly before the guest to read
# the ILI9341 ID (src/probe.rs). Diagnosis only, so off by default.
hw-probe = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
# The esp32c5 feature exists from esp-hal 1.2 on.
esp-hal = { version = "1.2", features = ["esp32c5", "unstable"] }
# For the app descriptor (`esp_app_desc!`) that the ESP-IDF second-stage
# bootloader requires; without it espflash 4.5 refuses to flash
# ("App Descriptor missing").
esp-bootloader-esp-idf = { version = "0.6", default-features = false, features = [
    "esp32c5",
] }
# Reads the app slot and the config slot from flash (docs/app-workflow.md §3.3).
# As on the ESP32-S3 the app is copied to RAM (an arbitrary offset cannot be
# assumed to be mapped into XIP).
esp-storage = { version = "0.10", features = ["esp32c5"] }
# Output goes through our own UART, so esp-println / esp-backtrace are not used.
# The panic handler is our own (docs/decisions.md A-04: log and halt, no restart).

[profile.release]
# Speed over size, like the other ports (docs/TODO.md §4).
opt-level = 3
lto = "fat"
codegen-units = 1
