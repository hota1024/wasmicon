# cargo reads .cargo/config.toml relative to the current directory, so the
# target lives here and the port is built from ports/esp32c5.
#
# The HP core of the ESP32-C5 is RV32IMAC (no FPU). Upstream Rust ships a
# prebuilt core for it, so no build-std as for the ESP32-S3.
[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
rustflags = ["-Clink-arg=-Tlinkall.x"]
