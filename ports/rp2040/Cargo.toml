# RP2040 (Raspberry Pi Pico WH) 用ポート。
# root workspace とはターゲットも toolchain も profile も違うので別 workspace。
[workspace]

[package]
name = "wasmicon-rp2040"
description = "Wasmicon の RP2040 ポート"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
# docs/handoff.md §5 Phase 4: トレースを出すビルド。既定で有効にしておく。
default = ["trace"]
trace = []

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../common" }
cortex-m = "0.7"
cortex-m-rt = "0.7"
rp2040-hal = { version = "0.12", features = ["rt", "critical-section-impl"] }
rp2040-boot2 = "0.3"
panic-halt = "1"
embedded-hal = "1"

[profile.release]
# 速度優先（2026-10-11。docs/TODO.md §4）。rp2350 の実機で、z と比べて計算が
# 16〜35%、host call が 7〜37% 速くなった（コードは 71 → 116 KB。フラッシュは
# 十分に余っている）。インタプリタとポートの HAL だけ 3 にする上書きも試したが、
# fat LTO の最後の最適化が z で走るせいか、呼び出しと host call が速くならなかった。
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# デバッグ情報は残す（probe-rs で追える）。フラッシュには載らない。
debug = true
