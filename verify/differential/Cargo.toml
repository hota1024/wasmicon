# Differential test of wasmicon-core against wasmtime (docs/verification-report.md §2).
#
# wasmtime has a large dependency tree; in the root workspace it would slow down every
# cargo test. So it is a separate workspace with its own CI job.
[workspace]

[package]
name = "wasmicon-differential"
description = "Runs the same .wasm on wasmicon-core and wasmtime and cross-checks the traces"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
wasmicon-core = { path = "../../runtime" }
wasmicon-port = { path = "../../ports/common" }
wasmicon-host = { path = "../../ports/host" }
wasmtime = "45"
anyhow = "1"
