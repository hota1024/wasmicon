# App manifest (docs/app-workflow.md §4.7).
# The app looks up no roles: the display and the touch panel belong to the
# host. The host's mock and the Tab5 (`esp32p4`, `esp32p4-psram`) have a touch
# backend so far (docs/TODO.md §7); `wasmicon check --board` refuses the app on
# the other boards, whose display entries are those of apps/display-demo-rs.
version = 1

[requirements]
pin-roles = []

[board.rp2350.display]
driver = "ili9341"
cs = 17
dc = 20
rst = 21

[board.esp32s3.display]
driver = "ili9341"
cs = 10
dc = 14
rst = 15

# The Tab5's own panel and its touch controller (docs/device-layer.md §11.3).
[board.esp32p4.display]
driver = "tab5"

[board.esp32p4.touch]
driver = "tab5"
