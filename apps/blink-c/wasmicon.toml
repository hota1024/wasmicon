# App manifest (docs/app-workflow.md §4.7).
# deploy writes the wiring table ([board.<name>.roles]) to the device's config
# slot, and the firmware answers pin-by-role from that table alone; it has no
# built-in table (docs/app-workflow.md §3.9).
version = 1

[requirements]
pin-roles = ["led"]

# The LED is external: on none of these boards is the on-board LED a plain
# GPIO. GPIO -> 220-330 Ω resistor -> LED -> GND.
[board.rp2350.roles]
led = 15

[board.esp32s3.roles]
led = 2

[board.esp32c5.roles]
# GPIO4 has a 10 kΩ pull-up on the board (the LED may glow faintly while the
# pin is an input).
led = 4

[board.rp2040.roles]
led = 15
