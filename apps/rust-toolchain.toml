[toolchain]
# Pinned: on floating stable, a new clippy lint or a rustfmt output change can
# break CI without warning. Bump all five rust-toolchain.toml files together
# (root / apps / ports/rp2040 / ports/rp2350 / ports/esp32c5; esp32s3 uses the
# espup "esp" channel).
channel = "1.99.0"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
