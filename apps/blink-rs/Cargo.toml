[package]
name = "blink-rs"
description = "Blink. Looks up the LED pin with board.pin-by-role, so the same binary runs on every board"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# cdylib exports the memory as "memory" (docs/abi-spec.md §3.3).
crate-type = ["cdylib"]

[dependencies]
wasmicon-hal.workspace = true
