# App manifest (docs/app-workflow.md §4.7).
# One pin with the led role is used to measure gpio.write (nothing needs to
# be connected to it).
version = 1

[requirements]
pin-roles = ["led"]

[board.rp2350.roles]
led = 15

[board.esp32s3.roles]
led = 2

[board.esp32c5.roles]
# GPIO4 has a 10 kΩ pull-up on the board (the LED may glow faintly while the
# pin is an input).
led = 4

[board.rp2040.roles]
led = 15
