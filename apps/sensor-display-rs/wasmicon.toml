# App manifest (docs/app-workflow.md §4.7).
# deploy writes the wiring table ([board.<name>.roles]) to the device's config
# slot, and the firmware answers pin-by-role from that table alone; it has no
# built-in table (docs/app-workflow.md §3.9).
# Wiring diagram: apps/lcd-demo-rs/README.md.
version = 1

[requirements]
pin-roles = ["lcd-cs", "lcd-dc", "lcd-rst"]

[defaults]
# The host has no sensor, so run / check replay a recorded response by default.
i2c-replay = "../../verify/sht4x-replay.txt"

[board.rp2350.roles]
lcd-cs = 17
lcd-dc = 20
lcd-rst = 21

[board.esp32s3.roles]
lcd-cs = 10
lcd-dc = 14
lcd-rst = 15

[board.esp32c5.roles]
lcd-cs = 10
lcd-dc = 0
lcd-rst = 1

[board.rp2040.roles]
lcd-cs = 17
lcd-dc = 20
lcd-rst = 21
