[package]
name = "life-rs"
description = "Demo that keeps drawing the game of life on an ILI9341. No sensor needed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
wasmicon-hal.workspace = true

[features]
# Bench mode: runs 200 generations from the same seed at several SPI clocks
# and logs the compute and draw times over the UART (src/bench.rs).
bench = []
