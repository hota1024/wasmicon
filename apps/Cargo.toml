# Guest workspace (docs/decisions.md A-09). It targets wasm32-unknown-unknown
# with its own profile, so it is kept out of the root workspace. It is a
# workspace root because cargo looks up `.cargo/config.toml` from the current
# directory: build apps from `apps/`.
[workspace]
resolver = "3"
members = ["blink-rs", "sensor-display-rs", "lcd-demo-rs", "life-rs", "bench-rs", "rgb-led-rs", "assets-rs", "../bindings/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
wasmicon-hal = { path = "../bindings/rust" }

# Guests are all about size. Traps abort.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
