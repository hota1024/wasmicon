[workspace]
resolver = "3"
members = [
    "runtime",
    "tools/wasmicon-gen",
    "tools/wasmicon-cli",
    "ports/common",
    "ports/host",
]
# Targets with different toolchains or profiles are separate workspaces (docs/decisions.md A-09):
# apps/ (guest; includes bindings/rust), ports/{rp2040,rp2350,esp32s3,esp32c5}, verify/differential.
exclude = ["bindings/rust", "apps", "ports/rp2040", "ports/esp32s3", "ports/esp32c5"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
wasmicon-core = { path = "runtime" }
wasmicon-port = { path = "ports/common" }

# Release profile for size measurement. panic = "abort" and strip are not set here
# because host tools and cargo test need unwinding; they live in the guest and
# port workspaces.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
