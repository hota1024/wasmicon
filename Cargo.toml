[workspace]
resolver = "3"
members = ["runtime", "tools/wasmicon-gen", "ports/host"]
# ターゲット / toolchain / profile が異なるものは別 workspace にする（HANDOFF §3 #9）。
# bindings/rust は guest workspace の root、apps/*-rs は Phase 3 でそこに加わる。
# ports/rp2040 と ports/esp32s3 は Phase 4 で作る。
exclude = ["bindings/rust", "apps", "ports/rp2040", "ports/esp32s3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
wasmicon-core = { path = "runtime" }

# サイズ計測用。panic = "abort" と strip はここに置かない
# （ホストツールと cargo test は unwind が要る）。HANDOFF §5 Phase 2
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
