[toolchain]
# Pinned: a floating stable breaks CI without warning through new clippy lints or
# rustfmt output changes. When bumping, update all five rust-toolchain.toml files
# together (root, apps, ports/rp2040, ports/rp2350, ports/esp32c5; esp32s3 uses
# espup's "esp" channel).
channel = "1.99.0"
components = ["rustfmt", "clippy"]
