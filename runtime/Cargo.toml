[package]
name = "wasmicon-core"
description = "Core Wasm interpreter for Wasmicon: no_std, zero dependency crates, no alloc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# No dependency crates (docs/decisions.md D-11). The core itself stays at zero.
[dependencies]

# Only the spec test runner (runtime/tests/) may have dependencies.
[dev-dependencies]
serde_json = "1"
