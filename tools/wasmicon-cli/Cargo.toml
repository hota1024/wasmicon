[package]
name = "wasmicon-cli"
description = "The wasmicon CLI app authors use: check, run and deploy apps (docs/app-workflow.md §4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "wasmicon"
path = "src/main.rs"

[dependencies]
# The check runs the real runtime (docs/app-workflow.md §4.3). An external
# validator such as wasm-tools sees neither the exact import table nor the
# per-board Config.
wasmicon-core.workspace = true
wasmicon-port.workspace = true
# run calls the host port as a library (the crate stays; docs/app-workflow.md §4.2).
wasmicon-host = { path = "../../ports/host" }
anyhow = "1.0.104"
# Reads wasmicon.toml (docs/app-workflow.md §4.7). serde derive is used so that
# unknown keys are errors: ignoring them silently hides "I set it but it has
# no effect".
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
# Tells the serial ports apart by USB identity (VID / PID, product string,
# interface number), so a board's own USB console is not mistaken for the
# USB-serial adapter that carries the trace (docs/TODO.md §5-11). No libudev:
# on Linux it reads sysfs.
serialport = { version = "4.10.1", default-features = false, features = ["usbportinfo-interface"] }
